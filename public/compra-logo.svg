<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Premium Gradient -->
    <linearGradient id="compraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Glowing background aura -->
  <circle cx="50%" cy="50%" r="40%" fill="url(#sparkGlow)" />

  <!-- The stylized Shopping Bag & Layout Frame Combined -->
  <!-- Outer bounding layout box with dotted corners, representing AI design transformation -->
  <rect x="15" y="25" width="70" height="60" rx="8" fill="none" stroke="url(#compraGrad)" stroke-width="4.5" stroke-dasharray="1 1" />
  
  <!-- Solid core shopping bag handle / layout arc -->
  <path d="M35 25 C35 12, 65 12, 65 25" fill="none" stroke="url(#compraGrad)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Solid base of the shopping bag -->
  <path d="M22 35 L78 35 L72 80 C72 83, 69 85, 66 85 L34 85 C31 85, 28 83, 28 80 Z" fill="url(#compraGrad)" opacity="0.12" />
  <path d="M22 35 L78 35 L72 80 C72 83, 69 85, 66 85 L34 85 C31 85, 28 83, 28 80 Z" fill="none" stroke="url(#compraGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Center AI layout node spark -->
  <g transform="translate(50, 60)">
    <!-- Main glowing diamond spark -->
    <path d="M0 -15 L4 -4 L15 0 L4 4 L0 15 L-4 4 L-15 0 L-4 -4 Z" fill="url(#compraGrad)" />
    <!-- Secondary tiny stars -->
    <circle cx="12" cy="-12" r="2.5" fill="#fafafa" />
    <circle cx="-12" cy="12" r="1.5" fill="#0d9488" />
  </g>
</svg>
